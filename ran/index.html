<!DOCTYPE html>
<html>
<head>
    <title>Ai Store  Eng/Abdelrahman Afifi 01094737134 - تعديل سوفت من 7.00-13.00</title>
    <link rel="stylesheet" href="../style.css">
    <style>
        /* تثبيت اسم Eng/Abdelrahman Afifi باللون الذهبي الثابت */
        .name-Eng/Abdelrahman Afifi {
            color: #ffd700 !important;
            font-weight: 900 !important;
            font-size: 3rem !important;
            letter-spacing: 5px !important;
            font-family: 'Orbitron', sans-serif !important;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4) !important;
            display: block !important;
            background: none !important;
            -webkit-background-clip: unset !important;
            -webkit-text-fill-color: #ffd700 !important;
            animation: none !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-Ai Store">Ai Store</span>
                <span class="Eng-title">Eng</span>
                <span class="Abdelrahman Afifi-title">Abdelrahman Afifi</span>
            </h1>
            <div class="subtitle">Ps4 تعديل</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </header>
        
        <hr class="separator">

        <div class="status-bar">
            <span id="msgs" class="status-text loading">جاري تعفيل جولد هين v2.4b18.10... برجاء الانتظار</span>
        </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Ai Store  Eng/Abdelrahman Afifi 01094737134</a></p>
            <span style="color: ##FFFFFF; font-size: 20px;">العنوان/محافظة الشرقية/فاقوس/ش مشالي بجوار مدرسة النصر ومكتبة علاء الدين </span>
        </footer>
    </div>

    <script>
        // ======== نفس المنطق البرمجي الأصلي تماماً ========
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        var msgs = document.getElementById('msgs');

        function onScriptError() {
            msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
        }

        if (!isPS4) {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 13.00";
                msgs.className = "status-text error";
            });
        } else {
            if (window.applicationCache.status == '0') {
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cache700.html");
                    }, 500);
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cache900.html");
                    }, 500);
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cachecss.html");
                    }, 500);
                } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cacheslopkit.html");
                    }, 500);
                } else {
                    document.addEventListener("DOMContentLoaded", () => {
                        msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
                        msgs.className = "status-text error";
                    });
                }
            } else {
                // التحميل التلقائي للـ exploit - بدون أي أزرار
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "700/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "900/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.src = "css/main.js";
                    script.onerror = onScriptError;
                    script.onload = function () {
                        setTimeout(function () {
                            doJb();
                        }, 500);
                    };
                    document.head.appendChild(script);
                }
                else if (fwNum >= 11.50 && fwNum <= 12.02) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_lapse.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 12.50 && fwNum <= 13.00) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_poops.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
            }
        }
    </script>
</body>
</html>
