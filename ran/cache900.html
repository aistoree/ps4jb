<!DOCTYPE html>
<html manifest="900.manifest">
<head>
    <title>Ai Store  Eng/Abdelrahman Afifi 01094737134 - Cache 9.00-9.60</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-Ai Store ">Ai Store </span>
                <span class="Eng-title">Eng</span>
                <span class="Abdelrahman Afifi-title">Abdelrahman Afifi</span>
            </h1>
            <div class="subtitle">Ps4 تعديل</div>
            <div class="version-badge">FW 9.00 - 9.60</div>
        </header>
        
        <hr class="separator">
        
        <div class="status-bar">
            <span id="msgs" class="status-text loading">⏳ بدء تثبيت ذاكرة التخزين المؤقت...</span>
         </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Ai Store  Eng/Abdelrahman Afifi 01094737134</a></p>
            <span style="color: ##FFFFFF; font-size: 20px;">العنوان/محافظة الشرقية/فاقوس/ش مشالي بجوار مدرسة النصر ومكتبة علاء الدين </span>
        </footer>
    </div>

    <script>
        history.replaceState(null, null, 'index.html');
        var histlength = history.length;
        history.go(-histlength);
        
        var msgs = document.getElementById('msgs');
        
        function DLProgress(e) {
            var Percent = Math.round(e.loaded / e.total * 100);
            msgs.innerHTML = "Installing Offline Cache: " + Percent + "%";
        }
        
        function DisplayCacheProgress() {
            msgs.innerHTML = "Cache Installed Successfully ✔";
            msgs.className = "status-text success";
            setTimeout(function() {
                msgs.innerHTML = "الان اغلق المتصفح واغلق الانترنت واعادة فتح المتصفح ...";
            }, 1500);
        }
        
        window.applicationCache.addEventListener("progress", DLProgress, false);
        window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };
        window.applicationCache.onerror = function(e) {
            msgs.innerHTML = "Error Installing Cache! - Clear and Re-Open Your Browser ...";
            msgs.className = "status-text error";
        };
    </script>
</body>
</html>
